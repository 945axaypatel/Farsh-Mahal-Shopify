      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.15" flood-color="#1B4332" />
    </filter>
  </defs>
  <!-- Background rug -->
  <path d="M 100 60 Q 300 30 500 60 Q 550 300 520 620 Q 300 720 80 620 Q 50 300 100 60 Z" fill="#EAE4DA" filter="url(#shadow)" />
  

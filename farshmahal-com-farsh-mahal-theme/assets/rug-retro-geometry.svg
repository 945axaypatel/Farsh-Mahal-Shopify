  <path d="M 200 220 Q 300 200 400 220 Q 380 320 300 380 Q 220 320 200 220 Z" fill="#C9A24D" opacity="0.9" />

  <!-- Concentric Carved Arch Grooves -->
  <path d="M 140 480 Q 300 380 460 480" stroke="#FFFFFF" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M 130 520 Q 300 420 470 520" stroke="#FFFFFF" stroke-width="3" fill="none" opacity="0.5"/>
  <path d="M 120 560 Q 300 460 480 560" stroke="#FFFFFF" stroke-width="3" fill="none" opacity="0.4"/>

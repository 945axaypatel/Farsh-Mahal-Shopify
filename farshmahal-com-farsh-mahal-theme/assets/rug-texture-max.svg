<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.15" flood-color="#1B4332" />
    </filter>
  </defs>
  <rect x="50" y="50" width="500" height="650" rx="6" fill="#F0EAE1" filter="url(#shadow)"/>
  
  <!-- Warm Sculpted Overlapping Shapes -->
  <path d="M 50 180 C 180 120, 360 160, 550 100 L 550 500 C 400 580, 220 520, 50 620 Z" fill="#E2D4C3"/>
  <path d="M 50 280 C 180 220, 320 280, 550 220 L 550 420 C 380 480, 240 420, 50 500 Z" fill="#CBB69E"/>

  <!-- High-Low Textures & Shag Simulation Lines -->
  <g stroke="#FFFFFF" stroke-width="2.5" opacity="0.6" stroke-linecap="round">
    <line x1="90" y1="200" x2="140" y2="230"/>
    <line x1="160" y1="220" x2="220" y2="250"/>
    <line x1="240" y1="240" x2="310" y2="270"/>
    <line x1="330" y1="260" x2="400" y2="290"/>
    <line x1="420" y1="280" x2="490" y2="310"/>

    <line x1="100" y1="320" x2="160" y2="350"/>
    <line x1="180" y1="340" x2="250" y2="370"/>
    <line x1="270" y1="360" x2="340" y2="390"/>
    <line x1="360" y1="380" x2="430" y2="410"/>
  </g>
</svg>

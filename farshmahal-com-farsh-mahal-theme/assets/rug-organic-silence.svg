      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-opacity="0.12" flood-color="#1B4332" />
    </filter>
  </defs>
  <rect width="600" height="750" fill="#FBF8F4"/>
  <!-- Organic Wavy Border Rug -->
  <path d="M 110 90 C 220 60, 400 70, 480 110 C 530 180, 510 320, 520 460 C 530 590, 480 670, 370 690 C 230 710, 100 670, 90 540 C 80 410, 110 310, 90 190 C 75 130, 85 110, 110 90 Z" fill="#EAE5DA" filter="url(#shadow-silence)"/>

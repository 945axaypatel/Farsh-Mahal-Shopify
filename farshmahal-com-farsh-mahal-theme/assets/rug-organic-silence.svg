  <path d="M 120 240 C 210 190, 390 300, 490 230" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="14 12" fill="none" opacity="0.8"/>
  <path d="M 120 360 C 210 310, 390 420, 490 350" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="14 12" fill="none" opacity="0.8"/>
  <path d="M 120 480 C 210 430, 390 540, 490 470" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="14 12" fill="none" opacity="0.8"/>

  <path d="M 90 440 C 220 390, 360 490, 500 420 L 500 690 L 90 690 Z" fill="#C8BCAB"/>
  <path d="M 90 560 C 200 500, 340 600, 460 540 L 460 690 L 90 690 Z" fill="#A79B87"/>
